<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dhun</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column. Sticky wordmark + tabs, a numbered song list, a mini player pinned to the bottom that opens a full player sheet. */
:root{
  --bg:#EEF0F8; --surface:#FFFFFF; --surface2:#E2E6F4; --fg:#14162B; --muted:#585D7C; --line:#D2D7EA;
  --accent:#FF9A1F; --accent-ink:#2B1700; --accent-text:#A85200; --danger:#B93232;
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Noto Sans Devanagari',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E1E; --surface:#171932; --surface2:#212550; --fg:#EDEFFF; --muted:#9AA1CC; --line:#2A2E5E;
    --accent:#FFB13B; --accent-ink:#2B1700; --accent-text:#FFB13B; --danger:#FF8585; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E1E; --surface:#171932; --surface2:#212550; --fg:#EDEFFF; --muted:#9AA1CC; --line:#2A2E5E;
  --accent:#FFB13B; --accent-ink:#2B1700; --accent-text:#FFB13B; --danger:#FF8585; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:720px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{display:flex;align-items:baseline;gap:10px;margin:0}
.brand b{font:800 30px/1 var(--display);letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:14px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;flex:none;color:inherit}
.ib:hover{background:var(--surface2)}
.ib.on{color:var(--accent-text)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:4px 14px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.tab small{font-family:var(--mono);margin-left:6px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:700}
.tab[aria-selected="true"] small{color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.danger{color:var(--danger)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:10px}
.tools input[type=search]{flex:1 1 160px;min-width:0}
input[type=search],input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.jump{display:flex;align-items:center;gap:6px;margin:0}
.jump label{color:var(--muted);font-size:13px}
.jump input{width:72px;font-family:var(--mono)}
.status{margin:4px 0 10px;color:var(--muted);font-size:13px}
.status b{color:var(--fg);font-family:var(--mono)}
.warn{margin:0 0 10px;padding:10px 12px;border:1px solid var(--danger);border-radius:10px;color:var(--danger);font-size:13px}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0}
.row.on{background:var(--surface)}
.num{width:34px;flex:none;text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
.row.on .num{color:var(--accent-text)}
.main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:6px 0;text-align:left}
.txt{min-width:0;display:flex;flex-direction:column}
.txt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .txt b{color:var(--accent-text)}
.txt small{color:var(--muted);font-family:var(--mono);font-size:12px}
.art{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:8px;color:#fff;font:800 20px/1 var(--display);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.art.empty{background:var(--surface2);color:var(--muted);text-shadow:none}
.art.xl{width:min(72vw,300px);height:min(72vw,300px);border-radius:16px;font-size:110px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:100%;background:var(--accent-text);transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none}}
.empty-state{padding:40px 8px;text-align:center;color:var(--muted)}
.empty-state h3{font:800 22px var(--display);color:var(--fg);margin:0 0 6px}
.empty-state .btn{margin-top:12px}
.plform{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.plform input{flex:1 1 180px}
.back{background:none;border:0;padding:4px 0;color:var(--muted)}
.plh{font:800 28px/1.1 var(--display);margin:6px 0;overflow-wrap:anywhere}
.plact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mini{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mini-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:10px;position:relative}
.mini-bar{position:absolute;top:-1px;left:0;height:2px;background:var(--accent);width:0}
.mini .main{padding:0}
.pb{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.player{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pin{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ptop{display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#pArt{display:grid;place-items:center}
.ptitle{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ptitle div{min-width:0}
.ptitle h2{margin:0;font:800 24px/1.15 var(--display);overflow-wrap:anywhere;text-wrap:balance}
.ptitle p{margin:2px 0 0;color:var(--muted);font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ctrl{display:flex;align-items:center;justify-content:space-between}
.ctrl .pb{width:64px;height:64px}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.qh{font:800 18px var(--display);margin:6px 0 0}
.queue{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.queue li{border-bottom:1px solid var(--line)}
.queue li:last-child{border:0}
.queue button{width:100%;display:flex;gap:10px;align-items:center;background:transparent;border:0;padding:9px 10px;text-align:left}
.queue li.on{background:var(--surface)}
.queue li.on b{color:var(--accent-text)}
.queue b{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue small{font-family:var(--mono);color:var(--muted);font-size:12px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,6,20,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:75vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:720px;margin:0 auto}
.sheet h3{margin:0 0 10px;font:800 18px/1.2 var(--display);overflow-wrap:anywhere}
.sheet ul{list-style:none;margin:0 0 10px;padding:0}
.sh{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:13px 2px;text-align:left}
.sh.danger{color:var(--danger)}
.sh small{font-family:var(--mono);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center}
.hbtns{display:flex;gap:2px}
.auth{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;overflow-y:auto;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.auth-in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px;margin:0}
.auth-in h2{font:800 40px/1 var(--display);margin:0}
.auth-in p{margin:0 0 8px;color:var(--muted)}
.auth-in label{font-size:13px;color:var(--muted)}
.autherr{min-height:20px;color:var(--danger);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand"><b>Dhun</b><span>धुन</span></h1>
    <div class="hbtns"><button class="ib" data-act="signout" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button><button class="ib" data-act="theme" aria-label="Switch light and dark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Library sections"></nav>
  <div id="head"></div>
  <section class="tools" id="tools">
    <button class="btn primary" data-act="addfiles" id="addBtn"></button>
    <input id="q" type="search" placeholder="Search songs" aria-label="Search songs">
    <form id="jumpForm" class="jump"><label for="jump">Play #</label><input id="jump" type="number" inputmode="numeric" min="1" placeholder="5"><button class="btn" type="submit">Go</button></form>
  </section>
  <ol class="list" id="list"></ol>
</div>

<div class="auth" id="auth" hidden>
  <form id="authForm" class="auth-in">
    <h2>Dhun</h2>
    <p>Sign in to open your songs on any device.</p>
    <label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" required>
    <label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" minlength="6" required>
    <p class="autherr" id="authErr" role="alert"></p>
    <div class="plact"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" data-act="signup">Create account</button></div>
  </form>
</div>

<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple hidden>

<div class="mini" id="mini">
  <div class="mini-in">
    <div class="mini-bar" id="miniBar"></div>
    <button class="main" data-act="open-player" aria-label="Open player"><span id="miniArt"></span><span class="txt"><b id="miniTitle">Nothing playing</b><small id="miniSub">Tap any song to start</small></span></button>
    <button class="pb" id="miniPlay" data-act="pplay" aria-label="Play or pause"></button>
    <button class="ib" data-act="pnext" id="miniNext" aria-label="Next song"></button>
  </div>
</div>

<div class="player" id="player" hidden role="dialog" aria-label="Now playing">
  <div class="pin">
    <div class="ptop">
      <button class="ib" data-act="close-player" id="pClose" aria-label="Close player"></button>
      <span class="eyebrow">Now playing</span>
      <button class="ib" data-act="pmenu" id="pMore" aria-label="More options"></button>
    </div>
    <div id="pArt"></div>
    <div class="ptitle"><div><h2 id="pTitle">Nothing playing</h2><p id="pSub"></p></div><button class="ib" id="pHeart" data-act="pheart" aria-label="Like"></button></div>
    <div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div></div>
    <div class="ctrl">
      <button class="ib" id="bShuf" data-act="pshuffle" aria-label="Shuffle"></button>
      <button class="ib" id="bPrev" data-act="pprev" aria-label="Previous song"></button>
      <button class="pb" id="bPlay" data-act="pplay" aria-label="Play or pause"></button>
      <button class="ib" id="bNext" data-act="pnext" aria-label="Next song"></button>
      <button class="ib" id="bRep" data-act="prepeat" aria-label="Repeat"></button>
    </div>
    <div class="opts">
      <button class="btn" id="bRate" data-act="prate">1×</button>
      <button class="btn" id="bSleep" data-act="psleep">Sleep off</button>
      <form id="pjumpForm" class="jump"><label for="pjump">Go to #</label><input id="pjump" type="number" inputmode="numeric" min="1"><button class="btn" type="submit">Go</button></form>
    </div>
    <label class="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="1"></label>
    <h3 class="qh">Queue</h3>
    <ol class="queue" id="queue"></ol>
  </div>
</div>

<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const mb=b=>(b/1048576).toFixed(1)+' MB';
const pad=(n,t)=>String(n).padStart(t>99?3:2,'0');
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- icons ---------- */
const P={
 play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
 pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>',
 next:'<path d="M6 5l9 7-9 7z" fill="currentColor"/><path d="M18 5v14"/>',
 prev:'<path d="M18 5l-9 7 9 7z" fill="currentColor"/><path d="M6 5v14"/>',
 shuffle:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
 repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
 repeat1:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/>',
 heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
 heartfill:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" fill="currentColor"/>',
 dots:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
 check:'<path d="m5 13 4 4L19 7"/>'
};
const ico=(n,s)=>`<svg viewBox="0 0 24 24" width="${s||22}" height="${s||22}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- Supabase ---------- */
const SUPABASE_URL='https://fyihwqzpcstzrozajpcl.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_A7pi5cri4dlgkoPJWenn2g_mx0etjVH';
const BUCKET='songs';
const CONFIGURED=!SUPABASE_URL.startsWith('YOUR_');
const sb=CONFIGURED?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let USER=null;
const urlCache=new Map();
const URL_TTL=21600;
function cachedUrl(s){const c=urlCache.get(s.id);return c&&c.exp>Date.now()?c.url:null}
async function songUrl(s){
  const r=await sb.storage.from(BUCKET).createSignedUrl(s.path,URL_TTL);
  if(r.error)throw r.error;
  urlCache.set(s.id,{url:r.data.signedUrl,exp:Date.now()+(URL_TTL-60)*1000});
  return r.data.signedUrl;
}
async function prefetchUrls(list){
  if(!list.length)return;
  const r=await sb.storage.from(BUCKET).createSignedUrls(list.map(s=>s.path),URL_TTL);
  if(r.error||!r.data)return;
  const byPath=new Map(list.map(s=>[s.path,s]));
  r.data.forEach(x=>{const s=byPath.get(x.path);if(s&&x.signedUrl)urlCache.set(s.id,{url:x.signedUrl,exp:Date.now()+(URL_TTL-60)*1000})});
}

/* ---------- state ---------- */
const M=new Map();
const S={songs:[],playlists:[],liked:new Set(),view:'songs',q:'',renaming:false,base:[],queue:[],qi:-1,label:'',
  repeat:ls.get('dhun-repeat')||'off',shuffle:false,rate:1,sleepMin:0,sleepT:null,persist:false};
const A=new Audio();A.preload='auto';
let curUrl=null,seeking=false,toastT=null;
const cur=()=>M.get(S.queue[S.qi]);
const RATES=[0.75,1,1.25,1.5,2],SLEEPS=[0,15,30,60];

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}

function art(s,cls){
  if(!s)return `<span class="art empty ${cls||''}">${ico('music',cls==='xl'?56:22)}</span>`;
  const h=hash(s.title),a=h%360,b=(a+50+(h>>3)%60)%360;
  const ch=(s.title.replace(/^Sample · /,'').match(/[\p{L}\p{N}]/u)||['♪'])[0].toUpperCase();
  return `<span class="art ${cls||''}" style="background:linear-gradient(140deg,hsl(${a} 72% 52%),hsl(${b} 70% 34%))">${esc(ch)}</span>`;
}

function ctx(){
  const v=S.view;
  if(v==='songs')return{ids:S.songs.map(s=>s.id),label:'Library'};
  if(v==='liked')return{ids:S.songs.filter(s=>S.liked.has(s.id)).map(s=>s.id),label:'Liked songs'};
  if(v.startsWith('pl:')){const p=S.playlists.find(p=>p.id===v.slice(3));if(p)return{ids:p.ids.filter(id=>M.has(id)),label:p.name}}
  return{ids:[],label:''};
}

/* ---------- rendering ---------- */
function renderTabs(){
  const t=[['songs','Songs',S.songs.length],['playlists','Playlists',S.playlists.length],['liked','Liked',S.songs.filter(s=>S.liked.has(s.id)).length]];
  const active=S.view.startsWith('pl:')?'playlists':S.view;
  $('#tabs').innerHTML=t.map(x=>`<button class="tab" role="tab" aria-selected="${x[0]===active}" data-act="tab" data-v="${x[0]}">${x[1]}<small>${x[2]}</small></button>`).join('');
}
function renderHead(){
  const v=S.view;let h='';
  if(v==='songs'){
    const tot=S.songs.reduce((a,s)=>a+s.size,0);
    h=`<p class="status"><b>${S.songs.length}</b> songs · ${mb(tot)} · saved in your account</p>`;
      }else if(v==='liked'){
    h=`<p class="status"><b>${ctx().ids.length}</b> liked songs</p>`;
  }else if(v==='playlists'){
    h=`<form id="plForm" class="plform"><input id="plName" type="text" placeholder="New playlist name" maxlength="60" aria-label="New playlist name"><button class="btn primary" type="submit">Create</button></form>`;
  }else{
    const p=S.playlists.find(p=>p.id===v.slice(3));
    if(!p){S.view='playlists';return renderHead()}
    const ids=ctx().ids,secs=ids.reduce((a,id)=>a+(M.get(id).duration||0),0);
    h=`<button class="back" data-act="tab" data-v="playlists">‹ Playlists</button>`+
      (S.renaming?`<form id="renForm" class="plform"><input id="renName" type="text" value="${esc(p.name)}" maxlength="60" aria-label="Playlist name"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="rename-cancel">Cancel</button></form>`:`<h2 class="plh">${esc(p.name)}</h2>`)+
      `<p class="status"><b>${ids.length}</b> songs · ${Math.round(secs/60)} min</p><div class="plact"><button class="btn primary" data-act="pl-play">Play</button><button class="btn" data-act="pl-shuffle">Shuffle</button><button class="btn" data-act="pl-rename">Rename</button><button class="btn danger" data-act="pl-del">Delete playlist</button></div>`;
  }
  $('#head').innerHTML=h;
  $('#tools').hidden=(v==='playlists');
  $('#addBtn').innerHTML=ico('plus',18)+' Add songs';
  if(S.renaming){const i=$('#renName');if(i)i.select()}
}
function renderList(){
  const L=$('#list'),v=S.view;
  if(v==='playlists'){
    L.innerHTML=S.playlists.map((p,i)=>{
      const ids=p.ids.filter(id=>M.has(id));
      return `<li class="row"><span class="num">${pad(i+1,S.playlists.length)}</span><button class="main" data-act="pl-open" data-id="${p.id}">${art(M.get(ids[0]))}<span class="txt"><b>${esc(p.name)}</b><small>${ids.length} songs</small></span></button></li>`;
    }).join('')||`<li class="empty-state"><h3>No playlists yet</h3>Name one above, then add songs from any song's menu.</li>`;
    return;
  }
  const c=ctx(),total=c.ids.length,q=S.q.trim().toLowerCase(),curId=S.queue[S.qi],playing=!A.paused&&curId;
  let html='';
  c.ids.forEach((id,i)=>{
    const s=M.get(id);
    if(q&&!s.title.toLowerCase().includes(q)&&String(i+1)!==q)return;
    const on=id===curId,liked=S.liked.has(id);
    html+=`<li class="row${on?' on':''}"><span class="num">${on&&playing?'<span class="eq"><i></i><i></i><i></i></span>':pad(i+1,total)}</span>`+
      `<button class="main" data-act="play" data-id="${id}">${art(s)}<span class="txt"><b>${esc(s.title)}</b><small>${fmt(s.duration)} · ${mb(s.size)}${s.sample?' · sample':''}</small></span></button>`+
      `<button class="ib${liked?' on':''}" data-act="heart" data-id="${id}" aria-label="${liked?'Unlike':'Like'}" aria-pressed="${liked}">${ico(liked?'heartfill':'heart',20)}</button>`+
      `<button class="ib" data-act="menu" data-id="${id}" aria-label="More options">${ico('dots',20)}</button></li>`;
  });
  if(!html){
    if(q)html=`<li class="empty-state">No song matches “${esc(S.q)}”.</li>`;
    else if(v==='songs')html=`<li class="empty-state"><h3>Your library is empty</h3>Add songs from your phone or computer. They are saved in your account and play as many times as you like.<br><button class="btn primary" data-act="addfiles">${ico('plus',18)} Add songs</button></li>`;
    else if(v==='liked')html=`<li class="empty-state"><h3>No liked songs</h3>Tap the heart on any song and it shows up here.</li>`;
    else html=`<li class="empty-state"><h3>This playlist is empty</h3>Open a song's menu and choose Add to playlist.</li>`;
  }
  L.innerHTML=html;
}
function renderMini(){
  const s=cur(),paused=A.paused;
  $('#miniArt').innerHTML=art(s);
  $('#miniTitle').textContent=s?s.title:'Nothing playing';
  $('#miniSub').textContent=s?`Track ${S.base.indexOf(s.id)+1} of ${S.base.length} · ${S.label}`:'Tap any song to start';
  $('#miniPlay').innerHTML=ico(paused?'play':'pause',22);
  $('#miniNext').innerHTML=ico('next',22);
}
function renderPlayer(){
  const s=cur();
  $('#pClose').innerHTML=ico('down',24);$('#pMore').innerHTML=ico('dots',22);
  $('#pArt').innerHTML=art(s,'xl');
  $('#pTitle').textContent=s?s.title:'Nothing playing';
  $('#pSub').textContent=s?`Track ${S.base.indexOf(s.id)+1} of ${S.base.length} · ${S.label}`:'Pick a song from your library';
  const liked=s&&S.liked.has(s.id);
  $('#pHeart').innerHTML=ico(liked?'heartfill':'heart',24);$('#pHeart').classList.toggle('on',!!liked);
  $('#bShuf').innerHTML=ico('shuffle',22);$('#bShuf').classList.toggle('on',S.shuffle);
  $('#bPrev').innerHTML=ico('prev',26);$('#bNext').innerHTML=ico('next',26);
  $('#bPlay').innerHTML=ico(A.paused?'play':'pause',30);
  $('#bRep').innerHTML=ico(S.repeat==='one'?'repeat1':'repeat',22);$('#bRep').classList.toggle('on',S.repeat!=='off');
  $('#bRep').setAttribute('aria-label',{off:'Repeat off',all:'Repeat all',one:'Repeat this song'}[S.repeat]);
  $('#bRate').textContent=S.rate+'×';
  $('#bSleep').textContent=S.sleepMin?`Sleep ${S.sleepMin} min`:'Sleep off';
  const curId=S.queue[S.qi];
  $('#queue').innerHTML=S.base.map((id,i)=>{const x=M.get(id);return `<li class="${id===curId?'on':''}"><button data-act="qjump" data-n="${i+1}"><small>${pad(i+1,S.base.length)}</small><b>${esc(x.title)}</b><small>${fmt(x.duration)}</small></button></li>`}).join('')||`<li style="padding:14px;color:var(--muted)">Play a song and the queue shows up here.</li>`;
  $('#vol').value=A.volume;
}
function renderPlayState(){
  $('#miniPlay').innerHTML=ico(A.paused?'play':'pause',22);
  $('#bPlay').innerHTML=ico(A.paused?'play':'pause',30);
  renderList();
}
function renderAll(){renderTabs();renderHead();renderList();renderMini();renderPlayer()}

/* ---------- playback ---------- */
let loadTok=0;
async function loadTrack(auto){
  const s=cur();if(!s)return;
  const tok=++loadTok;
  setMeta();renderAll();
  let url=cachedUrl(s);
  if(!url){
    try{url=await songUrl(s)}catch(e){if(tok===loadTok)toast('Could not load this song. Check your connection.');return}
    if(tok!==loadTok)return;
  }
  A.src=url;A.defaultPlaybackRate=S.rate;A.playbackRate=S.rate;A.loop=S.repeat==='one';
  if(auto)A.play().catch(()=>{});
}
function playList(ids,i,label){
  if(!ids.length)return;
  S.base=ids.slice();S.label=label;
  if(S.shuffle){S.queue=[ids[i],...shuf(ids.filter((_,k)=>k!==i))];S.qi=0}else{S.queue=ids.slice();S.qi=i}
  loadTrack(true);
}
function toggle(){
  if(S.qi<0){const c=ctx();if(!c.ids.length){toast('Add a song first');return}playList(c.ids,0,c.label);return}
  if(A.paused)A.play().catch(()=>{});else A.pause();
}
function next(){
  if(!S.queue.length)return;
  if(S.qi<S.queue.length-1){S.qi++;loadTrack(true)}
  else if(S.repeat==='all'){S.qi=0;loadTrack(true)}
  else toast('That was the last song');
}
function prev(){
  if(!S.queue.length)return;
  if(A.currentTime>3){A.currentTime=0;return}
  if(S.qi>0){S.qi--;loadTrack(true)}
  else if(S.repeat==='all'&&S.queue.length>1){S.qi=S.queue.length-1;loadTrack(true)}
  else A.currentTime=0;
}
function toggleShuffle(){
  S.shuffle=!S.shuffle;
  if(S.qi>=0){const id=S.queue[S.qi];
    if(S.shuffle){S.queue=[id,...shuf(S.base.filter(x=>x!==id))];S.qi=0}
    else{S.queue=S.base.slice();S.qi=S.queue.indexOf(id)}}
  renderPlayer();toast(S.shuffle?'Shuffle on':'Shuffle off');
}
function cycleRepeat(){
  S.repeat={off:'all',all:'one',one:'off'}[S.repeat];ls.set('dhun-repeat',S.repeat);
  A.loop=S.repeat==='one';renderPlayer();
  toast({off:'Repeat off',all:'Repeat all songs',one:'Repeating this song again and again'}[S.repeat]);
}
function jumpTo(ids,label,raw){
  const n=parseInt(raw,10);
  if(!ids.length){toast('No songs here yet');return}
  if(!n||n<1||n>ids.length){toast(`Pick a number from 1 to ${ids.length}`);return}
  playList(ids,n-1,label);
}
function dropFromQueue(id){
  const curId=S.queue[S.qi];
  if(curId===id){A.pause();A.removeAttribute('src');A.load();if(curUrl){URL.revokeObjectURL(curUrl);curUrl=null}S.qi=-1;S.queue=[];S.base=[]}
  else{S.base=S.base.filter(x=>x!==id);S.queue=S.queue.filter(x=>x!==id);S.qi=S.queue.indexOf(curId)}
}
function setMeta(){
  const s=cur();if(!s||!('mediaSession' in navigator))return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:'Dhun',album:S.label})}catch(e){}
}
if('mediaSession' in navigator){
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',()=>A.play().catch(()=>{}));h('pause',()=>A.pause());h('previoustrack',prev);h('nexttrack',next);
  h('seekto',d=>{if(d.seekTime!=null)A.currentTime=d.seekTime});
}
function tick(){
  const d=A.duration,t=A.currentTime,ok=isFinite(d)&&d>0;
  $('#miniBar').style.width=ok?(t/d*100)+'%':'0';
  $('#tCur').textContent=fmt(t);$('#tDur').textContent=fmt(ok?d:(cur()?cur().duration:0));
  if(!seeking)$('#seek').value=ok?Math.round(t/d*1000):0;
}
A.addEventListener('timeupdate',tick);
A.addEventListener('loadedmetadata',tick);
A.addEventListener('play',renderPlayState);
A.addEventListener('pause',renderPlayState);
A.addEventListener('ended',()=>{
  if(S.qi<S.queue.length-1){S.qi++;loadTrack(true)}
  else if(S.repeat==='all'){S.qi=0;loadTrack(true)}
  else{A.currentTime=0;renderPlayState()}
});
A.addEventListener('error',()=>{if(A.getAttribute('src'))toast('This file could not be played. Try another format like mp3 or m4a.')});

/* ---------- adding songs ---------- */
const TYPES={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg',flac:'audio/flac',weba:'audio/webm',webm:'audio/webm'};
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').replace(/\s+/g,' ').trim()||n;
function probe(f){return new Promise(res=>{
  const a=new Audio(),u=URL.createObjectURL(f);let done=false;
  const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);res(isFinite(d)?d:0)};
  a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(0);setTimeout(()=>fin(0),8000);a.src=u;
})}
let uploading=false;
async function addFiles(files){
  if(!USER){toast('Sign in first');return}
  if(uploading){toast('Wait for the current upload to finish');return}
  const list=[...files].filter(f=>/^audio\//.test(f.type)||/\.(mp3|m4a|aac|wav|ogg|opus|flac|weba|webm)$/i.test(f.name));
  if(!list.length){toast('Pick audio files such as mp3, m4a or wav');return}
  uploading=true;
  let n=0,dup=0,i=0;const fresh=[];
  for(const f of list){
    i++;
    if(S.songs.some(s=>s.name===f.name&&s.size===f.size)){dup++;continue}
    toast(`Uploading ${i} of ${list.length}…`);
    const ext=(f.name.split('.').pop()||'mp3').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp3';
    const type=f.type||TYPES[ext]||'audio/mpeg';
    const id=crypto.randomUUID(),path=`${USER.id}/${id}.${ext}`;
    const blob=new Blob([f],{type});
    const dur=await probe(blob);
    const up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,upsert:false});
    if(up.error){toast('Upload failed: '+up.error.message);continue}
    const row={id,title:clean(f.name),name:f.name,size:f.size,duration:dur,path};
    const ins=await sb.from('songs').insert(row).select().single();
    if(ins.error){await sb.storage.from(BUCKET).remove([path]);toast('Could not save '+row.title);continue}
    const rec={id,title:row.title,name:row.name,size:row.size,duration:dur,path,added:ins.data.created_at,liked:false};
    S.songs.push(rec);M.set(id,rec);fresh.push(rec);n++;
  }
  uploading=false;
  renderAll();
  toast(n?`${n} song${n>1?'s':''} added${dup?`, ${dup} already there`:''}`:(dup?'Those songs are already in your library':'Nothing was added'));
  prefetchUrls(fresh);
}
$('#file').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* ---------- playlists, likes, delete ---------- */
function savePl(){
  if(!USER||!S.playlists.length)return;
  sb.from('playlists').upsert(S.playlists.map(p=>({id:p.id,name:p.name,song_ids:p.ids}))).then(r=>{if(r.error)toast('Could not save playlists')});
}
async function saveLikes(){
  for(const s of S.songs){
    const want=S.liked.has(s.id);
    if(!!s.liked!==want){s.liked=want;const r=await sb.from('songs').update({liked:want}).eq('id',s.id);if(r.error)toast('Could not save like')}
  }
}
function createPl(name){name=(name||'').trim();if(!name)return null;const p={id:crypto.randomUUID(),name,ids:[]};S.playlists.push(p);savePl();return p}
function togglePl(pid,id){
  const p=S.playlists.find(p=>p.id===pid);if(!p)return;
  const i=p.ids.indexOf(id);
  if(i>=0){p.ids.splice(i,1);toast('Removed from '+p.name)}else{p.ids.push(id);toast('Added to '+p.name)}
  savePl();
}
function queueAdd(id,after){
  if(S.qi<0){playList([id],0,'Queue');return}
  if(after){S.base.splice(S.base.indexOf(S.queue[S.qi])+1,0,id);S.queue.splice(S.qi+1,0,id);toast('Plays next')}
  else{S.base.push(id);S.queue.push(id);toast('Added to queue')}
  renderMini();renderPlayer();
}
async function deleteSong(id){
  const s=M.get(id);dropFromQueue(id);
  S.songs=S.songs.filter(x=>x.id!==id);M.delete(id);S.liked.delete(id);urlCache.delete(id);
  S.playlists.forEach(p=>{p.ids=p.ids.filter(x=>x!==id)});
  renderAll();
  if(s){await sb.storage.from(BUCKET).remove([s.path]);await sb.from('songs').delete().eq('id',id)}
  savePl();toast('Song deleted');
}

/* ---------- bottom sheet ---------- */
function openSheet(html){
  $('#sheetHost').innerHTML=`<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog"><div class="sheet-in">${html}</div></div>`;
}
function closeSheet(){$('#sheetHost').innerHTML=''}
function songMenu(id){
  const s=M.get(id);if(!s)return;
  let h=`<h3>${esc(s.title)}</h3><ul>`+
    `<li><button class="sh" data-act="playnext" data-id="${id}">Play next</button></li>`+
    `<li><button class="sh" data-act="queueadd" data-id="${id}">Add to queue</button></li>`+
    `<li><button class="sh" data-act="pick" data-id="${id}">Add to playlist</button></li>`;
  if(S.view.startsWith('pl:'))h+=`<li><button class="sh" data-act="rempl" data-id="${id}" data-pid="${S.view.slice(3)}">Remove from this playlist</button></li>`;
  h+=`<li><button class="sh danger" data-act="del" data-id="${id}">Delete from library</button></li></ul>`;
  openSheet(h);
}
function picker(id){
  const s=M.get(id);if(!s)return;
  let h=`<h3>Add “${esc(s.title)}” to a playlist</h3><ul>`+
    S.playlists.map(p=>{const has=p.ids.includes(id);return `<li><button class="sh" data-act="tpl" data-pid="${p.id}" data-id="${id}"><span>${esc(p.name)}</span><small>${has?ico('check',18):p.ids.length+' songs'}</small></button></li>`}).join('')+
    `</ul><form id="sheetNew" class="plform" data-id="${id}"><input id="sheetNewName" type="text" placeholder="New playlist" maxlength="60" aria-label="New playlist name"><button class="btn primary" type="submit">Create and add</button></form>`;
  openSheet(h);
}

/* ---------- player sheet ---------- */
function openPlayer(){$('#player').hidden=false;document.body.style.overflow='hidden';renderPlayer();tick()}
function closePlayer(){$('#player').hidden=true;document.body.style.overflow=''}

/* ---------- theme ---------- */
function applyTheme(t){if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||
    (!document.documentElement.hasAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  const t=dark?'light':'dark';applyTheme(t);ls.set('dhun-theme',t);
}

/* ---------- events ---------- */
function setView(v){S.view=v;S.q='';S.renaming=false;$('#q').value='';renderAll();window.scrollTo(0,0)}
function armed(b,label){
  if(b.dataset.armed){return true}
  b.dataset.armed='1';b.textContent=label;return false;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':setView(b.dataset.v);break;
    case 'theme':toggleTheme();break;
    case 'addfiles':$('#file').click();break;
    case 'play':{const c=ctx(),i=c.ids.indexOf(id);if(S.queue[S.qi]===id&&S.label===c.label){toggle()}else playList(c.ids,i,c.label);break}
    case 'heart':if(S.liked.has(id))S.liked.delete(id);else S.liked.add(id);saveLikes();renderTabs();renderHead();renderList();renderPlayer();break;
    case 'menu':songMenu(id);break;
    case 'pick':picker(id);break;
    case 'tpl':togglePl(b.dataset.pid,id);picker(id);renderTabs();break;
    case 'playnext':queueAdd(id,true);closeSheet();break;
    case 'queueadd':queueAdd(id,false);closeSheet();break;
    case 'rempl':{const p=S.playlists.find(p=>p.id===b.dataset.pid);if(p){p.ids=p.ids.filter(x=>x!==id);savePl()}closeSheet();renderAll();toast('Removed from playlist');break}
    case 'del':if(armed(b,'Tap again to delete for good')){closeSheet();deleteSong(id)}break;
    case 'close-sheet':closeSheet();break;
    case 'pl-open':S.view='pl:'+id;S.q='';$('#q').value='';renderAll();window.scrollTo(0,0);break;
    case 'pl-play':{const c=ctx();if(!c.ids.length){toast('Add songs to this playlist first');break}S.shuffle=false;playList(c.ids,0,c.label);break}
    case 'pl-shuffle':{const c=ctx();if(!c.ids.length){toast('Add songs to this playlist first');break}S.shuffle=true;playList(c.ids,Math.floor(Math.random()*c.ids.length),c.label);break}
    case 'pl-rename':S.renaming=true;renderHead();break;
    case 'rename-cancel':S.renaming=false;renderHead();break;
    case 'pl-del':if(armed(b,'Tap again to delete playlist')){const pid=S.view.slice(3);S.playlists=S.playlists.filter(p=>p.id!==pid);sb.from('playlists').delete().eq('id',pid).then(()=>{});setView('playlists');toast('Playlist deleted')}break;
    case 'signout':sb.auth.signOut();break;
    case 'signup':authSubmit('up');break;
    case 'open-player':openPlayer();break;
    case 'close-player':closePlayer();break;
    case 'pplay':toggle();break;
    case 'pnext':next();break;
    case 'pprev':prev();break;
    case 'pshuffle':toggleShuffle();break;
    case 'prepeat':cycleRepeat();break;
    case 'prate':S.rate=RATES[(RATES.indexOf(S.rate)+1)%RATES.length];A.defaultPlaybackRate=S.rate;A.playbackRate=S.rate;renderPlayer();break;
    case 'psleep':{S.sleepMin=SLEEPS[(SLEEPS.indexOf(S.sleepMin)+1)%SLEEPS.length];clearTimeout(S.sleepT);
      if(S.sleepMin){const m=S.sleepMin;S.sleepT=setTimeout(()=>{A.pause();S.sleepMin=0;renderPlayer();toast('Sleep timer: paused')},m*60000);toast(`Music stops in ${m} min`)}
      renderPlayer();break}
    case 'pheart':{const s=cur();if(!s)break;if(S.liked.has(s.id))S.liked.delete(s.id);else S.liked.add(s.id);saveLikes();renderTabs();renderList();renderPlayer();break}
    case 'pmenu':{const s=cur();if(s)songMenu(s.id);break}
    case 'qjump':{const id2=S.base[parseInt(b.dataset.n,10)-1];S.qi=S.queue.indexOf(id2);loadTrack(true);break}
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='authForm'){authSubmit('in')}
  else if(f.id==='jumpForm'){const c=ctx();jumpTo(c.ids,c.label,$('#jump').value);$('#jump').value=''}
  else if(f.id==='pjumpForm'){
    const n=parseInt($('#pjump').value,10);
    if(!S.base.length){toast('Play a song first')}
    else if(!n||n<1||n>S.base.length){toast(`Pick a number from 1 to ${S.base.length}`)}
    else{S.qi=S.queue.indexOf(S.base[n-1]);loadTrack(true)}
    $('#pjump').value='';
  }
  else if(f.id==='plForm'){const p=createPl($('#plName').value);if(p){S.view='pl:'+p.id;renderAll();toast('Playlist created')}}
  else if(f.id==='renForm'){const p=S.playlists.find(p=>p.id===S.view.slice(3)),n=$('#renName').value.trim();if(p&&n){p.name=n;savePl()}S.renaming=false;renderAll()}
  else if(f.id==='sheetNew'){const p=createPl($('#sheetNewName').value);if(p){togglePl(p.id,f.dataset.id);closeSheet();renderAll()}}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderList()});
const seek=$('#seek');
['pointerdown','touchstart'].forEach(ev=>seek.addEventListener(ev,()=>{seeking=true},{passive:true}));
['pointerup','pointercancel','touchend','change'].forEach(ev=>seek.addEventListener(ev,()=>{seeking=false}));
seek.addEventListener('input',()=>{if(isFinite(A.duration)){A.currentTime=seek.value/1000*A.duration;$('#tCur').textContent=fmt(A.currentTime)}});
$('#vol').addEventListener('input',e=>{A.volume=parseFloat(e.target.value);ls.set('dhun-vol',String(A.volume))});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#sheetHost').firstChild)closeSheet();else if(!$('#player').hidden)closePlayer();return}
  const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key===' '&&t!=='BUTTON'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'){e.shiftKey?next():(A.currentTime+=10)}
  else if(e.key==='ArrowLeft'){e.shiftKey?prev():(A.currentTime=Math.max(0,A.currentTime-10))}
});

/* ---------- account ---------- */
async function authSubmit(mode){
  if(!CONFIGURED)return;
  const email=$('#aEmail').value.trim(),password=$('#aPass').value;
  if(!email||password.length<6){$('#authErr').textContent='Enter your email and a password of at least 6 characters.';return}
  $('#authErr').textContent='Please wait…';
  const r=mode==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){$('#authErr').textContent=r.error.message;return}
  $('#authErr').textContent=(mode==='up'&&!r.data.session)?'Account created. Open the email we sent to confirm, then sign in.':'';
}
function resetState(){
  A.pause();A.removeAttribute('src');A.load();
  S.songs=[];S.playlists=[];S.liked=new Set();S.base=[];S.queue=[];S.qi=-1;S.label='';S.view='songs';S.q='';
  M.clear();urlCache.clear();renderAll();
}
async function loadAll(){
  const [a,b]=await Promise.all([
    sb.from('songs').select('*').order('created_at'),
    sb.from('playlists').select('*').order('created_at')]);
  if(a.error||b.error){toast('Could not load your library. Did you run setup.sql?');return}
  S.songs=a.data.map(r=>({id:r.id,title:r.title,name:r.name,size:Number(r.size)||0,duration:r.duration||0,path:r.path,added:r.created_at,liked:!!r.liked}));
  M.clear();S.songs.forEach(x=>M.set(x.id,x));
  S.liked=new Set(S.songs.filter(x=>x.liked).map(x=>x.id));
  S.playlists=b.data.map(r=>({id:r.id,name:r.name,ids:r.song_ids||[]}));
  renderAll();
  prefetchUrls(S.songs);
}
function onSession(session){
  if(session){
    if(USER&&USER.id===session.user.id)return;
    USER=session.user;$('#auth').hidden=true;$('#aPass').value='';loadAll();
  }else{
    USER=null;resetState();$('#auth').hidden=false;
  }
}

/* ---------- boot ---------- */
(function boot(){
  applyTheme(ls.get('dhun-theme'));
  const v=parseFloat(ls.get('dhun-vol'));if(isFinite(v))A.volume=Math.min(1,Math.max(0,v));
  renderAll();
  if(!CONFIGURED){
    $('#authErr').textContent='Setup needed: put your Supabase URL and anon key at the top of the script in index.html.';
    $('#auth').hidden=false;return;
  }
  sb.auth.onAuthStateChange((ev,session)=>onSession(session));
  sb.auth.getSession().then(r=>onSession(r.data.session));
})();
})();
</script>
